<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Card Battle & Summon System</title>
  <style>
    html { font-size: 18px; }
    body {
      margin: 0; padding: 1.5rem;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121218; color: #f0f0f5;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .game-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 1rem; }
    .status-panel {
      width: 100%; background: #1e1e28; border: 2px solid #333344;
      border-radius: 12px; padding: 1rem; display: flex; justify-content: space-between; align-items: center;
    }
    .stat { font-size: 1.4rem; font-weight: bold; color: #ffd700; }
    
    .battlefield {
      position: relative; width: 100%; height: 350px; background: #181822;
      border: 2px solid #2a2a3a; border-radius: 16px; display: flex;
      justify-content: center; align-items: center; perspective: 1000px; overflow: hidden;
    }
    
    /* Uses your uploaded summoning_circle.png */
    .summon-circle {
      position: absolute; width: 220px; height: 220px; border-radius: 50%;
      background: url('summoning_circle.png') center/cover no-repeat;
      border: 3px dashed #00e5ff; box-shadow: 0 0 30px #00e5ff; transform: rotateX(75deg); opacity: 0;
    }
    
    .card-wrapper { width: 190px; height: 270px; position: absolute; opacity: 0; transform-style: preserve-3d; }
    .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s; }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 14px; border: 3px solid #ffd700; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow: hidden; }
    
    /* Uses your uploaded card_back.png */
    .card-back { background: url('card_back.png') center/cover no-repeat; }
    
    .card-front { background: #15131d; transform: rotateY(180deg); position: relative; }
    .card-art { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    .card-title-box { z-index: 2; background: rgba(0,0,0,0.8); width: 100%; padding: 0.5rem 0; text-align: center; position: absolute; bottom: 0; border-top: 2px solid #ffd700; }
    .card-title { font-size: 1.1rem; color: #ffd700; font-weight: bold; }
    
    @keyframes circleGlow { 0% { opacity: 0; transform: rotateX(75deg) rotate(0deg); } 50% { opacity: 1; } 100% { opacity: 0; transform: rotateX(75deg) rotate(180deg); } }
    @keyframes riseFromCircle { 0% { transform: translateY(100px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    
    .battlefield.summoning .summon-circle { animation: circleGlow 1.6s ease-out forwards; }
    .battlefield.summoning .card-wrapper { animation: riseFromCircle 1.2s ease-out 0.3s forwards; }
    .card-wrapper.flipped .card-inner { transform: rotateY(180deg); }
    
    .btn { font-size: 1rem; padding: 0.75rem 1.5rem; border-radius: 10px; border: none; background: #00e5ff; cursor: pointer; font-weight: bold;}
    .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="status-panel">
      <div><h2>Mana</h2><div class="stat" id="manaDisplay">3 / 3</div></div>
      <div><h2>Enemy HP</h2><div class="stat" id="enemyHpDisplay">3000</div></div>
    </div>
    <div class="battlefield" id="battlefield">
      <div class="summon-circle"></div>
      <div class="card-wrapper" id="cardWrapper">
        <div class="card-inner">
          <div class="card-face card-back"></div>
          <div class="card-face card-front">
            <!-- Dynamically populated by Python -->
            <img class="card-art" id="cardArtImg" src="card_back.png" alt="Card Art">
            <div class="card-title-box">
              <div class="card-title" id="cardTitle">Unknown Entity</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button class="btn" id="summonBtn" onclick="handleSummonAction()">Manifest Ritual</button>
  </div>

  <script>
    let mana = 3;
    let enemyHp = 3000;

    // Python-to-JS Dynamic Bridge Receiver Function
    function initBattlefield(payload) {
      if (payload) {
        if (payload.mana) mana = payload.mana;
        if (payload.enemyHp) enemyHp = payload.enemyHp;
        if (payload.leaderImg) document.getElementById('cardArtImg').src = payload.leaderImg;
        if (payload.leaderName) document.getElementById('cardTitle').textContent = payload.leaderName;
        
        document.getElementById('manaDisplay').textContent = `${mana} / 3`;
        document.getElementById('enemyHpDisplay').textContent = enemyHp;
      }
    }

    function handleSummonAction() {
      const bf = document.getElementById('battlefield');
      const cw = document.getElementById('cardWrapper');
      const btn = document.getElementById('summonBtn');
      
      btn.disabled = true;
      bf.classList.remove('summoning');
      cw.classList.remove('flipped');
      void bf.offsetWidth; // Trigger reflow
      
      bf.classList.add('summoning');
      setTimeout(() => cw.classList.add('flipped'), 1200);
      setTimeout(() => btn.disabled = false, 2500);
    }
  </script>
</body>
</html>
