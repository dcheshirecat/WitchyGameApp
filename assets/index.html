<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Summon Ritual Engine</title>
  <style>
    body {
      margin: 0; 
      padding: 0;
      /* Transparent background so Kivy UI shows underneath */
      background-color: transparent; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh;
      overflow: hidden;
    }
    
    .battlefield {
      position: relative; 
      width: 100%; 
      height: 400px; 
      display: flex;
      justify-content: center; 
      align-items: center; 
      perspective: 1200px; 
    }
    
    .summon-circle {
      position: absolute; 
      width: 240px; 
      height: 240px; 
      border-radius: 50%;
      background: url('summoning_circle.png') center/cover no-repeat;
      border: 3px dashed #00e5ff; 
      box-shadow: 0 0 40px #00e5ff; 
      transform: rotateX(75deg); 
      opacity: 0;
    }
    
    .card-wrapper { 
      width: 210px; 
      height: 300px; 
      position: absolute; 
      opacity: 0; 
      transform-style: preserve-3d; 
    }
    
    .card-inner { 
      width: 100%; 
      height: 100%; 
      position: relative; 
      transform-style: preserve-3d; 
      transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }
    
    .card-face { 
      position: absolute; 
      width: 100%; 
      height: 100%; 
      backface-visibility: hidden; 
      border-radius: 14px; 
      border: 3px solid #ffd700; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      overflow: hidden; 
    }
    
    .card-back { background: url('card_back.png') center/cover no-repeat; }
    
    .card-front { 
      background: #15131d; 
      transform: rotateY(180deg); 
      position: relative; 
    }
    
    .card-art { 
      width: 100%; 
      height: 100%; 
      object-fit: cover;
      position: absolute; 
      top: 0; left: 0; 
      z-index: 1; 
    }
    
    .card-title-box { 
      z-index: 2; 
      background: rgba(0,0,0,0.85); 
      width: 100%; 
      padding: 0.75rem 0; 
      text-align: center; 
      position: absolute; 
      bottom: 0; 
      border-top: 2px solid #ffd700; 
      font-family: serif;
    }
    
    .card-title { font-size: 1.2rem; color: #ffd700; font-weight: bold; }
    
    @keyframes circleGlow { 
      0% { opacity: 0; transform: rotateX(75deg) rotate(0deg); } 
      30% { opacity: 1; box-shadow: 0 0 60px #00e5ff; } 
      100% { opacity: 0; transform: rotateX(75deg) rotate(180deg); } 
    }
    
    @keyframes riseFromCircle { 
      0% { transform: translateY(120px) scale(0.5); opacity: 0; } 
      100% { transform: translateY(0) scale(1); opacity: 1; } 
    }
    
    .summoning .summon-circle { animation: circleGlow 2s ease-out forwards; }
    .summoning .card-wrapper { animation: riseFromCircle 1.4s ease-out 0.4s forwards; }
    .flipped .card-inner { transform: rotateY(180deg); }
  </style>
</head>
<body>
  <div class="battlefield" id="battlefield">
    <div class="summon-circle"></div>
    <div class="card-wrapper" id="cardWrapper">
      <div class="card-inner">
        <div class="card-face card-back"></div>
        <div class="card-face card-front">
          <img class="card-art" id="cardArtImg" src="card_back.png" alt="Art">
          <div class="card-title-box">
            <div class="card-title" id="cardTitle">Unknown</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Called remotely by Python/PyJNIus!
    function triggerSummon(imageSrc, entityName) {
      const bf = document.getElementById('battlefield');
      const cw = document.getElementById('cardWrapper');
      
      // Update data
      document.getElementById('cardArtImg').src = imageSrc;
      document.getElementById('cardTitle').textContent = entityName;
      
      // Reset animation state
      bf.classList.remove('summoning');
      cw.classList.remove('flipped');
      void bf.offsetWidth; 
      
      // Trigger new 3D Summoning Sequence
      bf.classList.add('summoning');
      setTimeout(() => cw.classList.add('flipped'), 1400);
    }
  </script>
</body>
</html>
