<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Card Battle & Summon System</title>
  <style>
    /* -------------------------------------------------------------
       1. TYPOGRAPHY & BASE STYLES (Fixes Tiny Text)
       ------------------------------------------------------------- */
    html {
      font-size: 18px; /* High base size for legibility */
    }

    body {
      margin: 0;
      padding: 2rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121218;
      color: #f0f0f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1, h2, h3, p {
      margin: 0 0 0.5rem 0;
    }

    /* -------------------------------------------------------------
       BATTLEFIELD & UI CONTAINER
       ------------------------------------------------------------- */
    .game-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
    }

    .status-panel {
      width: 100%;
      background: #1e1e28;
      border: 2px solid #333344;
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }

    .status-box h2 {
      font-size: 1.25rem;
      color: #aaa;
    }

    .status-box .stat {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffd700;
    }

    .turn-indicator {
      font-size: 1.25rem;
      font-weight: bold;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      background: #2a2a3a;
      border: 1px solid #444455;
    }

    /* -------------------------------------------------------------
       3. SUMMONING & CARD ANIMATIONS
       ------------------------------------------------------------- */
    .battlefield {
      position: relative;
      width: 100%;
      height: 380px;
      background: #181822;
      border: 2px solid #2a2a3a;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px; /* 3D perspective depth */
      overflow: hidden;
    }

    /* Glowing Summoning Circle */
    .summon-circle {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 4px dashed #00e5ff;
      box-shadow: 0 0 30px #00e5ff, inset 0 0 30px #00e5ff;
      transform: rotateX(75deg);
      opacity: 0;
      pointer-events: none;
    }

    /* 3D Card Container */
    .card-wrapper {
      width: 200px;
      height: 290px;
      position: absolute;
      opacity: 0;
      transform-style: preserve-3d;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      border: 3px solid #ffd700;
      padding: 0.75rem;
    }

    /* Card Back (Visible during rise) */
    .card-back {
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: #ffd700;
      justify-content: center;
    }

    .card-back-symbol {
      font-size: 4rem;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    /* Card Front (Revealed after flip) */
    .card-front {
      background: linear-gradient(180deg, #2b2638 0%, #15131d 100%);
      color: #ffffff;
      transform: rotateY(180deg);
      justify-content: space-between;
    }

    .card-art {
      width: 100%;
      height: 140px;
      background: #3d3550;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      border: 1px solid #55486c;
    }

    .card-info {
      width: 100%;
      text-align: center;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #ffd700;
    }

    .card-stats {
      font-size: 1rem;
      font-weight: 600;
      color: #ff5555;
      margin-top: 0.25rem;
    }

    /* Animation Keyframes */
    @keyframes circleGlow {
      0% { transform: rotateX(75deg) rotate(0deg) scale(0.4); opacity: 0; }
      50% { opacity: 1; box-shadow: 0 0 50px #00e5ff, inset 0 0 40px #00e5ff; }
      100% { transform: rotateX(75deg) rotate(360deg) scale(1.3); opacity: 0; }
    }

    @keyframes riseFromCircle {
      0% { transform: translateY(120px) scale(0.3); opacity: 0; }
      60% { transform: translateY(-20px) scale(1.05); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* State Classes for Animation */
    .battlefield.summoning .summon-circle {
      animation: circleGlow 1.6s ease-out forwards;
    }

    .battlefield.summoning .card-wrapper {
      animation: riseFromCircle 1.2s ease-out 0.3s forwards;
    }

    .card-wrapper.flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* -------------------------------------------------------------
       CONTROLS & ACTION BUTTONS
       ------------------------------------------------------------- */
    .controls {
      display: flex;
      gap: 1rem;
      width: 100%;
      justify-content: center;
    }

    .btn {
      font-size: 1.1rem;
      font-weight: 600;
      padding: 0.85rem 1.75rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #00e5ff;
      color: #000;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 229, 255, 0.3);
    }

    .btn:hover:not(:disabled) {
      background: #33ebff;
      transform: translateY(-2px);
    }

    .btn:disabled {
      background: #3a3a4a;
      color: #777788;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .log-box {
      width: 100%;
      background: #15151e;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 0.85rem 1.25rem;
      font-size: 1rem;
      color: #8a8a9e;
      box-sizing: border-box;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- Battle Status Bar -->
    <div class="status-panel">
      <div class="status-box">
        <h2>Mana Energy</h2>
        <div class="stat" id="manaDisplay">3 / 3</div>
      </div>
      <div class="turn-indicator" id="turnIndicator">Your Turn</div>
      <div class="status-box" style="text-align: right;">
        <h2>Enemy HP</h2>
        <div class="stat" id="enemyHpDisplay">3000</div>
      </div>
    </div>

    <!-- Battle Stage -->
    <div class="battlefield" id="battlefield">
      <div class="summon-circle"></div>
      <div class="card-wrapper" id="cardWrapper">
        <div class="card-inner">
          <!-- Back Side (Summon Phase) -->
          <div class="card-face card-back">
            <div class="card-back-symbol">🂠</div>
          </div>
          <!-- Front Side (Flipped Phase) -->
          <div class="card-face card-front">
            <div class="card-art">🐉</div>
            <div class="card-info">
              <div class="card-title">Infernal Dragon</div>
              <div class="card-stats">ATK: 2400</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Log -->
    <div class="log-box" id="logBox">Choose an action to begin turn.</div>

    <!-- 2. BATTLE SYSTEM CONTROLS (Prevents Button Mashing) -->
    <div class="controls">
      <button class="btn" id="summonBtn" onclick="handleSummonAction()">Summon Card (Cost: 2)</button>
      <button class="btn" id="endTurnBtn" onclick="handleEndTurnAction()">End Turn</button>
    </div>
  </div>

  <script>
    /* -------------------------------------------------------------
       2. TURN-BASED STATE MACHINE & ACTION CONSTRAINTS
       ------------------------------------------------------------- */
    const States = {
      PLAYER_TURN: 'PLAYER_TURN',
      ANIMATING: 'ANIMATING',
      ENEMY_TURN: 'ENEMY_TURN'
    };

    let currentState = States.PLAYER_TURN;
    let mana = 3;
    let enemyHp = 3000;
    let cardSummoned = false;

    // DOM Elements
    const manaDisplay = document.getElementById('manaDisplay');
    const enemyHpDisplay = document.getElementById('enemyHpDisplay');
    const turnIndicator = document.getElementById('turnIndicator');
    const logBox = document.getElementById('logBox');
    const summonBtn = document.getElementById('summonBtn');
    const endTurnBtn = document.getElementById('endTurnBtn');
    const battlefield = document.getElementById('battlefield');
    const cardWrapper = document.getElementById('cardWrapper');

    function updateUI() {
      manaDisplay.textContent = `${mana} / 3`;
      enemyHpDisplay.textContent = enemyHp;

      if (currentState === States.PLAYER_TURN) {
        turnIndicator.textContent = 'Your Turn';
        turnIndicator.style.color = '#00e5ff';
        // Enable buttons based on state & resources
        summonBtn.disabled = cardSummoned || mana < 2;
        endTurnBtn.disabled = false;
      } else if (currentState === States.ANIMATING) {
        // Disable all buttons while actions or animations are running
        summonBtn.disabled = true;
        endTurnBtn.disabled = true;
      } else if (currentState === States.ENEMY_TURN) {
        turnIndicator.textContent = "Enemy's Turn";
        turnIndicator.style.color = '#ff5555';
        summonBtn.disabled = true;
        endTurnBtn.disabled = true;
      }
    }

    /* -------------------------------------------------------------
       3. SUMMONING ANIMATION CONTROLLER
       ------------------------------------------------------------- */
    function handleSummonAction() {
      if (currentState !== States.PLAYER_TURN || mana < 2 || cardSummoned) return;

      // Lock state during animation
      currentState = States.ANIMATING;
      mana -= 2;
      cardSummoned = true;
      updateUI();

      logBox.textContent = 'Channeling mana to open summoning portal...';

      // Reset card visual state
      battlefield.classList.remove('summoning');
      cardWrapper.classList.remove('flipped');
      void battlefield.offsetWidth; // Trigger DOM reflow

      // Step 1: Start Circle Glow & Card Rise
      battlefield.classList.add('summoning');

      // Step 2: Flip Card halfway through ceremony
      setTimeout(() => {
        logBox.textContent = 'Summoning complete! Revealing creature...';
        cardWrapper.classList.add('flipped');
      }, 1400);

      // Step 3: Deal attack damage & pass control back to player
      setTimeout(() => {
        enemyHp -= 2400;
        logBox.textContent = 'Infernal Dragon attacked the enemy for 2400 damage!';
        currentState = States.PLAYER_TURN;
        updateUI();
      }, 2200);
    }

    function handleEndTurnAction() {
      if (currentState !== States.PLAYER_TURN) return;

      currentState = States.ENEMY_TURN;
      updateUI();
      logBox.textContent = 'Enemy is taking their turn...';

      // Simulate Enemy AI decision delay
      setTimeout(() => {
        mana = 3; // Reset mana for player
        cardSummoned = false;
        
        // Hide card for next turn
        battlefield.classList.remove('summoning');
        cardWrapper.classList.remove('flipped');

        currentState = States.PLAYER_TURN;
        logBox.textContent = 'Your turn! Mana refreshed.';
        updateUI();
      }, 2000);
    }

    // Initial load
    updateUI();
  </script>
</body>
</html>
