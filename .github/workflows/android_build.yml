name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade Cython==0.29.33 virtualenv
          pip install buildozer

      - name: Build APK (with Error Capture)
        run: |
          # The 'tee' command lets us see the progress live while also saving it to a file
          yes | buildozer -v android debug | tee build_log.txt

      - name: 🚨 PRINT EXACT ERROR (If Build Fails) 🚨
        if: failure()
        run: |
          echo "========================================================"
          echo "BUILD FAILED! HERE IS THE ACTUAL CAUSE OF THE CRASH:"
          echo "========================================================"
          # This prints just the last 100 lines of the saved log
          tail -n 100 build_log.txt
          echo "========================================================"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-android-game
          path: bin/*.apk
