name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev cython3

      - name: Install Buildozer
        run: |
          pip install --upgrade Cython==0.29.33 virtualenv
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: Build APK (with Error Capture)
        run: |
          set -o pipefail
          yes | buildozer -v android debug | tee build_log.txt || echo "build_failed=true" >> $GITHUB_ENV

      - name: 🚨 PRINT EXACT ERROR (If Build Fails) 🚨
        if: env.build_failed == 'true'
        run: |
          echo "========================================================"
          echo "BUILD FAILED! HERE IS THE ACTUAL CAUSE OF THE CRASH:"
          echo "========================================================"
          tail -n 150 build_log.txt
          echo "========================================================"
          exit 1

      - name: Locate APK
        if: success() && env.build_failed != 'true'
        run: |
          mkdir -p final_apk_upload
          find . -name "*.apk" -exec mv {} final_apk_upload/ \;
          echo "Prepared the following APK for upload:"
          ls -la final_apk_upload/

      - name: Upload APK Artifact
        if: success() && env.build_failed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: my-android-game
          path: final_apk_upload/
          if-no-files-found: error
