name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt update
          # Added python3-dev to provide required C-headers
          sudo apt install -y build-essential git zip unzip python3-pip python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer & Cython
        run: |
          pip install "Cython<3.0" virtualenv
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build APK (with Error Capture)
        run: |
          set -o pipefail
          # Removed 'yes |' to prevent silent crashes in the toolchain
          buildozer -v android debug | tee build_log.txt || echo "build_failed=true" >> $GITHUB_ENV

      - name: 🚨 UPLOAD CRASH LOG 🚨
        if: env.build_failed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: full-crash-log
          path: build_log.txt

      - name: Fail the Build
        if: env.build_failed == 'true'
        run: exit 1

      - name: Locate APK
        if: success() && env.build_failed != 'true'
        run: |
          mkdir -p final_apk_upload
          find . -name "*.apk" -exec mv {} final_apk_upload/ \;
          echo "Prepared the following APK for upload:"
          ls -la final_apk_upload/

      - name: Upload APK Artifact
        if: success() && env.build_failed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: my-android-game
          path: final_apk_upload/
          if-no-files-found: error
