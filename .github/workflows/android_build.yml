name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libffi-dev libssl-dev zip unzip autoconf libtool pkg-config openjdk-17-jdk

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer "Cython<3.0" virtualenv

      - name: Build APK with Buildozer
        # The 2>&1 | tee command captures both standard output and errors into build_log.txt
        run: buildozer android debug 2>&1 | tee build_log.txt

      - name: Downloadable Crash Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Buildozer-Crash-Logs
          # This grabs our custom log and any internal Buildozer logs that might exist
          path: |
            build_log.txt
            .buildozer/**/*.txt
            .buildozer/**/*.log

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WitchyGame-APK
          path: bin/*arm64-v8a-debug.apk
