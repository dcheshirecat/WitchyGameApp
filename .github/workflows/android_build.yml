name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer & Cython
        run: |
          # Explicitly pin Cython to 0.29.33 to prevent Kivy recipe compilation crashes
          pip install Cython==0.29.33 virtualenv
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: Force Debug Logging in Spec
        run: |
          # If the spec exists, ensure log_level is set to 2 to catch internal compiler errors
          if [ -f "buildozer.spec" ]; then sed -i 's/.*log_level = .*/log_level = 2/' buildozer.spec; fi

      - name: Build APK (with Error Capture)
        run: |
          set -o pipefail
          yes | buildozer -v android debug | tee build_log.txt || echo "build_failed=true" >> $GITHUB_ENV

      - name: 🚨 PRINT EXACT ERROR (If Build Fails) 🚨
        if: env.build_failed == 'true'
        run: |
          echo "========================================================"
          echo "BUILD FAILED! HERE IS THE ACTUAL CAUSE OF THE CRASH:"
          echo "========================================================"
          # Expanded to 1000 lines to ensure we see the exact C-compiler or python-for-android exception
          tail -n 1000 build_log.txt
          echo "========================================================"
          exit 1

      - name: Locate APK
        if: success() && env.build_failed != 'true'
        run: |
          mkdir -p final_apk_upload
          find . -name "*.apk" -exec mv {} final_apk_upload/ \;
          echo "Prepared the following APK for upload:"
          ls -la final_apk_upload/

      - name: Upload APK Artifact
        if: success() && env.build_failed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: my-android-game
          path: final_apk_upload/
          if-no-files-found: error
