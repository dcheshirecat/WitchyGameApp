name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade Cython==0.29.33 virtualenv
          pip install buildozer

      - name: Build APK (with Error Capture)
        run: |
          # set -o pipefail ensures that if buildozer crashes, the whole step is marked as failed, even when using 'tee'
          set -o pipefail
          yes | buildozer -v android debug | tee build_log.txt
          
      - name: 🚨 PRINT EXACT ERROR (If Build Fails) 🚨
        if: failure()
        run: |
          echo "========================================================"
          echo "BUILD FAILED! HERE IS THE ACTUAL CAUSE OF THE CRASH:"
          echo "========================================================"
          tail -n 150 build_log.txt
          echo "========================================================"

      - name: Locate APK
        run: |
          mkdir -p final_apk_upload
          find . -name "*.apk" -exec mv {} final_apk_upload/ \;
          echo "Prepared the following APK for upload:"
          ls -la final_apk_upload/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-android-game
          path: final_apk_upload/
          if-no-files-found: error
