name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Purify Environment & Free Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          
          sudo fallocate -l 4G /swapfile-extra || sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=4096
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra
          sudo swapon /swapfile-extra

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        # Changed openjdk-17-jdk to openjdk-11-jdk to support the stable Gradle build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libffi-dev libssl-dev zip unzip autoconf libtool pkg-config openjdk-11-jdk

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer Cython==0.29.33 virtualenv

      - name: Force Stable P4A Branch
        run: |
          sed -i -e 's/^#* *p4a.branch.*/p4a.branch = release-2024.01.21/' buildozer.spec

      - name: Build APK with Buildozer
        env:
          MAKEFLAGS: "-j1"
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build_log.txt

      - name: 🚨 ISOLATE EXACT CRASH LOG 🚨
        if: failure()
        run: |
          echo "=========================================================="
          echo "ACTUAL COMPILER ERROR (SEARCHING FOR 'Command failed:'):"
          echo "=========================================================="
          grep -B 40 -A 10 "Command failed:" build_log.txt || echo "Could not find 'Command failed:'. Please check the downloaded build_log.txt artifact manually."
          echo "=========================================================="

      - name: Isolate Single APK
        if: success()
        run: |
          mkdir -p final_apk
          APK_FILE=$(ls bin/*arm64-v8a*.apk | head -n 1)
          cp "$APK_FILE" final_apk/WitchyGame.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WitchyGame-APK
          path: final_apk/WitchyGame.apk

      - name: Downloadable Crash Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Buildozer-Crash-Logs
          path: |
            build_log.txt
            .buildozer/**/*.txt
            .buildozer/**/*.log
