name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libffi-dev libssl-dev zip unzip autoconf libtool pkg-config openjdk-17-jdk

      - name: Install Buildozer and Cython
        # Pinning Cython to <3.0 prevents a major known Kivy compilation crash
        run: |
          pip install --upgrade pip
          pip install buildozer "Cython<3.0" virtualenv

      - name: Build APK with Buildozer
        run: buildozer android debug

      - name: 🚨 PRINT EXACT ERROR 🚨
        if: failure()
        run: |
          echo "========================================"
          echo "BUILD FAILED! FETCHING LOGS:"
          echo "========================================"
          cat .buildozer/android/platform/build-arm64-v8a/dists/*/logs/* || echo "No specific log file found. Please scroll up and check the 'Build APK with Buildozer' step output."

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WitchyGame-APK
          path: bin/*arm64-v8a-debug.apk
