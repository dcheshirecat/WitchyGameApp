name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git zip unzip python3-pip python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Install Buildozer & Cython
        run: |
          pip install "charset-normalizer<3.0"
          pip install "Cython<3.0" virtualenv
          pip install buildozer==1.5.0

      - name: Force Debug Logging
        run: |
          echo "log_level = 2" >> buildozer.spec

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-
          save-always: true

      # UPDATED: Enforce the Python version via environment variables
      - name: Build APK (with Error Capture)
        env:
          PYTHON_VERSION: 3.11.8
          P4A_PYTHON_VERSION: 3.11.8
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build_log.txt || echo "build_failed=true" >> $GITHUB_ENV

      - name: 🚨 PRINT EXACT ERROR 🚨
        if: env.build_failed == 'true'
        run: |
          echo "========================================================"
          echo "BUILD FAILED! HERE IS THE ACTUAL CAUSE OF THE CRASH:"
          echo "========================================================"
          tail -n 1500 build_log.txt
          echo "========================================================"

      - name: 🚨 UPLOAD CRASH LOG 🚨
        if: env.build_failed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: full-crash-log
          path: build_log.txt

      - name: Fail the Build
        if: env.build_failed == 'true'
        run: exit 1

      - name: Locate APK
        if: success() && env.build_failed != 'true'
        run: |
          mkdir -p final_apk_upload
          find . -name "*.apk" -exec mv {} final_apk_upload/ \;
          echo "Prepared the following APK for upload:"
          ls -la final_apk_upload/

      - name: Upload APK Artifact
        if: success() && env.build_failed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: my-android-game
          path: final_apk_upload/
          if-no-files-found: error
